services:
  db:
    image: pgvector/pgvector:pg17
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Password123@pg}
      POSTGRES_DB: ${POSTGRES_DB:-sqlbot}
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data
    networks:
      - sqlbot-network
  sqlbot:
    image: dataease/sqlbot
    container_name: sqlbot
    restart: always
    privileged: true
    ports:
      - 8000:8000
      - 8001:8001
    environment:
      # Database configuration
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: sqlbot
      POSTGRES_USER: root
      POSTGRES_PASSWORD: Password123@pg
      # Project basic settings
      PROJECT_NAME: "SQLBot"
      DEFAULT_PWD: "SQLBot@123456"
      # MCP settings
      SERVER_IMAGE_HOST: http://YOUR_SERVE_IP:MCP_PORT/images/
      # Auth & Security
      SECRET_KEY: y5txe1mRmS_JpOrUzFzHEu-kIQn3lf7ll0AOv9DQh0s
      # CORS settings
      BACKEND_CORS_ORIGINS: "http://localhost,http://localhost:5173,https://localhost,https://localhost:5173"
      # Logging
      LOG_LEVEL: "INFO"
      SQL_DEBUG: False
    volumes:
      - ./data/sqlbot/excel:/opt/sqlbot/data/excel
      - ./data/sqlbot/file:/opt/sqlbot/data/file
      - ./data/sqlbot/images:/opt/sqlbot/images
      - ./data/sqlbot/logs:/opt/sqlbot/app/logs
      - ./data/postgresql:/var/lib/postgresql/data
    networks:
      - sqlbot-network
  app:
    image: dataease/sqlbot-embedded-demo:dev
    container_name: sqlbot-embedded-demo
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./data/app:/usr/src/app
    networks:
      - sqlbot-network

networks:
  sqlbot-network:
